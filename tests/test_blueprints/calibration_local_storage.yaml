kind: analysis
name: get-data-calibration-local
pipeline: gwdata
# Overrides the event's real GW150914 time with a synthetic O4b-era GPS time
# so this analysis exercises find_calibrations_on_cit's O4-style archive
# lookup against the fake calibration archive built in CI, rather than the
# event's real (O1-era, unsupported) time.
event time: 1400000000
download:
  - calibration
source:
  type: local storage
locations:
  calibration directory: /tmp/gwdata-e2e/cal-archive
calibration version: v1
