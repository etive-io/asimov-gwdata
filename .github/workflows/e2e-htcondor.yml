name: End-to-End Tests (HTCondor)

# Runs asimov-gwdata as an actual asimov pipeline, submitting real HTCondor
# jobs inside an htcondor/mini container, for each major download type
# (GWOSC frames, local-storage calibration, PESummary-sourced calibration +
# PSDs, public-DCC calibration). This is the level below which asimov's
# own htcondor-tests.yml
# exercises asimov-gwdata as one step in a much larger PE workflow - this
# workflow exists so a regression in the gwdata<->asimov integration (e.g.
# the pipeline's config template, or Pipeline.build_dag/detect_completion)
# is caught here first, without depending on the asimov repo's own CI.
#
# The shared composite actions used below (setup-htcondor, create-submit-user,
# run-asimov-command, wait-for-files) live in etive-io/actions, which is used
# across the asimov plugin ecosystem for this same HTCondor CI scaffolding.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: "HTCondor End-to-End Test"
    runs-on: ubuntu-latest
    container:
      image: htcondor/mini:latest
      options: --privileged
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: etive-io/actions/setup-htcondor@v1

      - name: Install base tools
        run: |
          yum install -y sudo git

      - uses: etive-io/actions/create-submit-user@v1

      - name: Ensure submituser can access workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test_project"
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-activate-base: false
          python-version: "3.12"
          activate-environment: asimov
          channels: conda-forge
          use-mamba: true

      - name: Install asimov-gwdata (with asimov and HTCondor bindings) from source
        shell: bash -el {0}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          conda activate asimov
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall "."
          echo "Installed asimov from: $(python -c 'import asimov; print(asimov.__file__)')"
          echo "Installed gwdata pipeline plugin from: $(python -c 'import datafind.asimov; print(datafind.asimov.__file__)')"

      - name: Set up git
        run: |
          su - submituser <<SUBMITUSER
          set -euo pipefail
          git config --global init.defaultBranch master
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          SUBMITUSER

      # Both fixtures below live under $GITHUB_WORKSPACE rather than /tmp:
      # HTCondor execute-slot jobs in this container get a private /tmp
      # (confirmed by the local-storage calibration job below finding
      # nothing at a /tmp fixture path that plain, non-condor steps could
      # read fine), so anything a condor job needs to read back has to live
      # somewhere shared instead.
      - name: Build synthetic calibration archive fixture
        run: |
          for ifo in H1 L1; do
            dir="e2e-fixtures/cal-archive/${ifo}/uncertainty/v1/1400000/1400000000"
            mkdir -p "$dir"
            printf "# synthetic calibration uncertainty envelope\n1 1 0 1 1 0 0\n" \
              > "${dir}/calibration_uncertainty_${ifo}_1400000000.txt"
          done
          chmod -R a+rwX e2e-fixtures

      - name: Build synthetic PESummary metafile fixture
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            mkdir -p e2e-fixtures
            python3 -c "
            from tests.test_fixtures import create_mock_pesummary_metafile
            create_mock_pesummary_metafile('e2e-fixtures/fake_metafile.h5', ifos=('H1', 'L1'))
            "
            chmod a+r e2e-fixtures/fake_metafile.h5

      - name: Create asimov project
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: asimov init "Test Project"

      - name: Configure asimov user
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: asimov configuration update condor/user submituser

      - name: Configure HTCondor settings
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            asimov configuration update condor/cache_time 30
            asimov configuration update condor/cron_minute '*/1'

      - name: Add GW150914 event
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_event.yaml"

      # --- Scenario 1: GWOSC frames -------------------------------------
      # HTCondor execute-slot jobs in this container have no network/DNS
      # access at all, so pre-fetch the real GW150914 H1/L1 frame here, in a
      # plain script step, directly into the rundir the condor job below
      # will use. get_data_frames_gwosc() reuses an already-present frame
      # covering the requested window instead of re-querying GWOSC, so the
      # (network-dead) condor job picks this up instead of trying to
      # download it itself.
      # gwosc.org has also proven intermittently flaky from this
      # runner/container even in a plain (non-condor) step -- confirmed by
      # asimov-cogwheel's own e2e workflow, which retries its equivalent
      # fetch up to 5 times with a 15s backoff. Do the same here per
      # detector, skipping any that's already cached from a prior attempt.
      # Values mirror gwosc_frames.yaml ("file length: 32") and
      # gwosc_event.yaml ("event time: 1126259462.391") exactly -- keep them
      # in sync if either blueprint changes.
      - name: Pre-fetch the real GWOSC frame (condor jobs have no network)
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            mkdir -p working/GW150914_095045/get-data-frames
            cd working/GW150914_095045/get-data-frames
            python3 -c "
            import time
            from datafind.frames import get_data_frames_gwosc

            max_attempts = 5
            for detector in ['H1', 'L1']:
                for attempt in range(1, max_attempts + 1):
                    try:
                        get_data_frames_gwosc([detector], 1126259461.391, 1126259463.391, 32)
                        break
                    except Exception as e:
                        print(f'Attempt {attempt}/{max_attempts} to fetch {detector} failed: {e!r}')
                        if attempt == max_attempts:
                            raise
                        time.sleep(15)
            "

      - name: Add and submit GWOSC frames job
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_frames.yaml" -e GW150914_095045
            asimov manage build submit

      - name: Wait for frame files
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "H*.gwf"
          directory: "working/GW150914_095045/get-data-frames/frames"
          timeout: "300"
          interval: "15"

      - name: Wait for frame cache file
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "H1.cache"
          directory: "working/GW150914_095045/get-data-frames/cache"
          timeout: "60"
          interval: "10"

      - name: Wait for HTML report
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "index.html"
          directory: "working/GW150914_095045/get-data-frames/report"
          timeout: "120"
          interval: "10"

      # --- Scenario 2: local-storage calibration --------------------------
      # The blueprint's calibration directory is a placeholder (see the
      # comment in the blueprint file itself) - substitute in the actual
      # absolute path to the fixture built above before applying it.
      - name: Add and submit local-storage calibration job
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            sed "s|__E2E_FIXTURES_DIR__|$GITHUB_WORKSPACE/e2e-fixtures|g" \
              "$GITHUB_WORKSPACE/tests/test_blueprints/calibration_local_storage.yaml" \
              > /tmp/calibration_local_storage.yaml
            asimov apply -f /tmp/calibration_local_storage.yaml -e GW150914_095045
            asimov manage build submit

      - name: Wait for local-storage calibration files
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "H1.txt L1.txt"
          directory: "working/GW150914_095045/get-data-calibration-local/calibration"
          timeout: "120"
          interval: "10"

      # --- Scenario 3: calibration + PSDs from a PESummary metafile ------
      # Same placeholder substitution as scenario 2, for the metafile path.
      - name: Add and submit PESummary calibration+PSDs job
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            sed "s|__E2E_FIXTURES_DIR__|$GITHUB_WORKSPACE/e2e-fixtures|g" \
              "$GITHUB_WORKSPACE/tests/test_blueprints/calibration_psds_pesummary.yaml" \
              > /tmp/calibration_psds_pesummary.yaml
            asimov apply -f /tmp/calibration_psds_pesummary.yaml -e GW150914_095045
            asimov manage build submit

      - name: Wait for PESummary-sourced calibration files
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "H1.dat L1.dat"
          directory: "working/GW150914_095045/get-data-calibration-psds-pesummary/calibration"
          timeout: "120"
          interval: "10"

      - name: Wait for PESummary-sourced PSD files
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "H1.dat L1.dat"
          directory: "working/GW150914_095045/get-data-calibration-psds-pesummary/psds"
          timeout: "60"
          interval: "10"

      # --- Scenario 4: calibration from the public LIGO DCC ---------------
      # Same network constraint as scenario 1: pre-fetch the real O1
      # calibration archive here, in a plain script step, directly into the
      # rundir the condor job below will use. get_calibration_from_dcc()
      # caches the extracted archive on disk and skips re-downloading if
      # it's already there, so the (network-dead) condor job re-runs the
      # same lookup against this pre-fetched archive instead of trying to
      # reach the DCC itself.
      # dcc.ligo.org hasn't been observed to be flaky the way gwosc.org has,
      # but retries the same way as scenario 1's pre-fetch as cheap
      # insurance against a one-off failure.
      # GW150914's real event time is used unmodified here -- unlike
      # scenario 2 (which has to override it because find_calibrations_on_cit
      # doesn't support O1 at all), the public DCC's O1 coverage starts
      # before GW150914, so this scenario also demonstrates public-DCC
      # calibration succeeding for a time local-storage can't serve. Value
      # mirrors scenario 1's frame pre-fetch (event time minus 1s) exactly.
      - name: Pre-fetch the real DCC calibration archive (condor jobs have no network)
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            mkdir -p working/GW150914_095045/get-data-calibration-public-dcc
            cd working/GW150914_095045/get-data-calibration-public-dcc
            python3 -c "
            import time
            from datafind.calibration import get_calibration_from_dcc

            max_attempts = 5
            for attempt in range(1, max_attempts + 1):
                try:
                    get_calibration_from_dcc(1126259461.391, interferometers=['H1', 'L1'])
                    break
                except Exception as e:
                    print(f'Attempt {attempt}/{max_attempts} failed: {e!r}')
                    if attempt == max_attempts:
                        raise
                    time.sleep(15)
            "

      - name: Add and submit public-DCC calibration job
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/calibration_public_dcc.yaml" -e GW150914_095045
            asimov manage build submit

      - name: Wait for public-DCC calibration files
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "H1.txt L1.txt"
          directory: "working/GW150914_095045/get-data-calibration-public-dcc/calibration"
          timeout: "120"
          interval: "10"

      # --- Verification ---------------------------------------------------
      - name: Run asimov monitor
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: asimov monitor

      - name: Verify all four gwdata analyses completed
        uses: etive-io/actions/run-asimov-command@v1
        with:
          # Reads the ledger directly (rather than asimov.monitor_api, which
          # is only available on much newer asimov than this repo's declared
          # minimum) so this check works across the range of asimov versions
          # asimov-gwdata supports.
          script: |
            python3 <<'EOF'
            import sys
            import yaml

            with open(".asimov/ledger.yml") as f:
                ledger = yaml.safe_load(f)

            print("Final analysis statuses:")
            failures = []
            for event in ledger.get("events", []):
                for prod_entry in event.get("productions", []):
                    for name, prod in prod_entry.items():
                        status = str(prod.get("status", "")).lower()
                        print(f"  {name}: {status}")
                        if status not in ("finished", "uploaded"):
                            failures.append(f"{name}: {status}")
            if failures:
                print(f"\nFAIL: {len(failures)} analyses not complete:")
                for f in failures:
                    print(f"  - {f}")
                sys.exit(1)
            print("\nAll gwdata analyses are complete!")
            EOF

      - name: Archive testing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-htcondor-debug
          path: |
            .asimov/
            checkouts/
            working/
          retention-days: 5
